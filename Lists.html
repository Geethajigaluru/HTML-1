<!Doctype html>
<html>
    <head>
        <title>Lists</title>
    </head>
    <body>
        <h2>Fruits</h2>
        <ul>
            <li>Apple</li>
            <ul>
                <li>color:Red</li>
                <li>season:winter</li>
            </ul>
            <li>Mango</li>
            <ul>
                <li>color:Yellow</li>
                <li>season:summer</li>
            </ul>
            <li>Orange</li>
            <li>Banana</li>
            <li>Pomogranet</li>
        </ul>
        <h2>Students</h2>
        <ol type="I">
            <li>Veda</li>
            <ul>
                <li>marks:100</li>
            </ul>
            <li>Geetha</li>
            <ul>
                <li>marks:99</li>
            </ul>
            <li>Kavya</li>
            <li>Abhishek</li>
            <li>Ashwini</li>
        </ol>
    </body>
</html>
