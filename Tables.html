<!doctype html>
<html>
    <head>
        <title>Tables</title>
    </head>
    <body>
        <table border="n" border-collapse=collapse>
            <thead>
            <caption>Student data</caption>
            <tr>
                <th>Name</th>
                <th>Roll number</th>
                <th colspan="2">Subject</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td>Geetha</td>
                <td>24</td>
                <td>Computer science</td>
                <td>AI</td>
            </tr>
            <tr>
                <td>Veda</td>
                <td>16</td>
                <td rowspan="2">IAS</td>
            </tr>
            <tr>
                <td>Kavya</td>
                <td>26</td>
            </tr>
            </tbody>
        </table>
    </body>
</html>
